name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-13
            python-version: "3.12"
          - os: macos-14
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.in-project true

      - name: Install dependencies
        run: poetry install

      - name: Build TensorFlow ops library
        shell: bash
        run: |
          PYTHON_BIN="$(poetry run python -c 'import sys; print(sys.executable)')"
          poetry run cmake \
            -S banded_matrices \
            -B banded_matrices/build \
            -DPYTHON_BIN="$PYTHON_BIN" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="$PWD/banded_matrices/lib" \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$PWD/banded_matrices/bin" \
            -DCMAKE_CXX_STANDARD=17
          poetry run cmake --build banded_matrices/build --parallel 4

      - name: Run tests
        run: poetry run pytest -x -q
